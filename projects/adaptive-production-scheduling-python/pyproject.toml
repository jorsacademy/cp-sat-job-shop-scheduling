[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-production-scheduling"
version = "0.1.0"
description = "Adaptive, disruption-aware production scheduling heuristic for manufacturing experiments."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "jorsacademy"}]
dependencies = [
  "pandas>=2.0,<3.0",
]
license = {text = "Proprietary Non-Commercial License"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: Other/Proprietary License",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
