[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assembly-line-balancing-optimizer-salbp"
version = "0.1.0"
description = "SALBP-1 exact and heuristic workstation balancing in Python"
requires-python = ">=3.10"
dependencies = ["ortools>=9.10,<10"]

[tool.setuptools.packages.find]
where = ["src"]
