[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-sat-job-shop-scheduling"
version = "0.1.0"
description = "Job-shop scheduling with OR-Tools CP-SAT, exact validation, and scheduling diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jors Academy"}]
dependencies = ["ortools>=9.10,<10"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cp-sat-jssp = "cpsat_jssp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
